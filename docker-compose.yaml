x-otel-environment: &otel-environment
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
  OTEL_TRACES_SAMPLER_ARG: "1.0"

services:
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: ecom-prometheus
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --enable-feature=exemplar-storage
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - ecom_service-net

  docker-exporter:
    build:
      context: ./observability/docker-exporter
    container_name: ecom-docker-exporter
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - ecom_service-net

  mysql-exporter:
    image: prom/mysqld-exporter:v0.17.2
    container_name: ecom-mysql-exporter
    restart: unless-stopped
    command:
      - --mysqld.address=mysql:3306
      - --mysqld.username=prometheus
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:-${MYSQL_PASSWORD:-root}}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ecom_service-net

  mongodb-exporter:
    image: percona/mongodb_exporter:0.43.1
    container_name: ecom-mongodb-exporter
    restart: unless-stopped
    command:
      - --mongodb.uri=mongodb://mongodb:27017
      - --collect-all
    depends_on:
      - mongodb
    networks:
      - ecom_service-net

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.27.0
    container_name: ecom-blackbox-exporter
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./observability/blackbox/config.yml:/etc/blackbox_exporter/config.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ecom_service-net

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: ecom-kafka-exporter
    restart: unless-stopped
    command:
      - --kafka.server=kafka:19092
    depends_on:
      - kafka
    networks:
      - ecom_service-net

  loki:
    image: grafana/loki:3.4.2
    container_name: ecom-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    networks:
      - ecom_service-net

  tempo:
    image: grafana/tempo:2.7.2
    container_name: ecom-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "127.0.0.1:3200:3200"
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    networks:
      - ecom_service-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    container_name: ecom-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/collector.yml"]
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./observability/otel/collector.yml:/etc/otelcol-contrib/collector.yml:ro
    depends_on:
      - tempo
    networks:
      - ecom_service-net

  alloy:
    image: grafana/alloy:v1.8.3
    container_name: ecom-alloy
    restart: unless-stopped
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./logs:/var/log/ecom:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
    networks:
      - ecom_service-net

  grafana:
    image: grafana/grafana:11.5.2
    container_name: ecom-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - ecom_service-net

  mongodb:
    image: mongo:8
    container_name: product-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: product_service
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - ecom_service-net

  kafka:
    image: apache/kafka:4.1.0
    container_name: ecom-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LISTENERS: PLAINTEXT://:9092,DOCKER://:19092,CONTROLLER://:9093
    ports:
      - "9092:9092"
    networks:
      - ecom_service-net

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: ecom-kafka-ui
    restart: unless-stopped
    environment:
      KAFKA_CLUSTERS_0_NAME: ecom-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "127.0.0.1:8085:8080"
    depends_on:
      - kafka
    networks:
      - ecom_service-net

  mysql:
    image: mysql:8.4
    container_name: keycloak-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: auth_service
      MYSQL_USER: auth_service
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:-${MYSQL_PASSWORD:-root}}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ecom_service-net

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://mysql:3306/keycloak
      KC_DB_USERNAME: auth_service
      KC_DB_PASSWORD: ${MYSQL_PASSWORD:-root}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ecom_service-net

  auth-service:
    build:
      context: ./auth-service
    container_name: auth-service
    restart: unless-stopped
    environment:
      <<: *otel-environment
      MYSQL_URL: jdbc:mysql://mysql:3306/auth_service
      MYSQL_USER: auth_service
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: ecomservice
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-auth-service}
      KEYCLOAK_AUTH_CLIENT_ID: ${KEYCLOAK_AUTH_CLIENT_ID:-auth-service}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}/realms/ecomservice
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/ecomservice/protocol/openid-connect/certs
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:8090}
    ports:
      - "8091:8091"
    volumes:
      - ./logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - ecom_service-net

  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    restart: unless-stopped
    environment:
      <<: *otel-environment
      AUTH_SERVICE_URL: http://auth-service:8091
      PRODUCT_SERVICE_URL: http://product-service:8097
      ORDER_SERVICE_URL: http://order-service:8096
      INVENTORY_SERVICE_URL: http://inventory-service:8094
      NOTIFICATION_SERVICE_URL: http://notification-service:8095
      DISPATCH_SERVICE_URL: http://dispatch-service:8093
      CART_SERVICE_URL: http://cart-service:8092
      KEYCLOAK_SERVICE_URL: http://keycloak:8080
    ports:
      - "8090:8090"
    volumes:
      - ./logs:/app/logs
    depends_on:
      - auth-service
      - product-service
      - order-service
      - inventory-service
      - notification-service
      - dispatch-service
      - cart-service
      - keycloak
    networks:
      - ecom_service-net

  product-service:
    build:
      context: ./product-service
    container_name: product-service
    restart: unless-stopped
    environment:
      <<: *otel-environment
      MONGODB_URI: mongodb://mongodb:27017/product_service
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}/realms/ecomservice
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/ecomservice/protocol/openid-connect/certs
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:8090}
    ports:
      - "8097:8097"
    volumes:
      - ./logs:/app/logs
    depends_on:
      - mongodb
      - kafka
      - keycloak
    networks:
      - ecom_service-net

  order-service:
    build:
      context: ./order-service
    container_name: order-service
    restart: unless-stopped
    environment:
      <<: *otel-environment
      MONGODB_URI: mongodb://mongodb:27017/order_service
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}/realms/ecomservice
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/ecomservice/protocol/openid-connect/certs
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:8090}
    ports:
      - "8096:8096"
    volumes:
      - ./logs:/app/logs
    depends_on:
      - mongodb
      - kafka
      - keycloak
    networks:
      - ecom_service-net

  inventory-service:
    build:
      context: ./inventory-service
    container_name: inventory-service
    restart: unless-stopped
    environment:
      <<: *otel-environment
      MONGODB_URI: mongodb://mongodb:27017/inventory_service
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}/realms/ecomservice
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/ecomservice/protocol/openid-connect/certs
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:8090}
    ports:
      - "8094:8094"
    volumes:
      - ./logs:/app/logs
    depends_on:
      - mongodb
      - kafka
      - keycloak
    networks:
      - ecom_service-net

  notification-service:
    build:
      context: ./notification-service
    container_name: notification-service
    restart: unless-stopped
    environment:
      <<: *otel-environment
      MONGODB_URI: mongodb://mongodb:27017/notification_service
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}/realms/ecomservice
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/ecomservice/protocol/openid-connect/certs
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@example.com}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      SMS_PROVIDER_URL: ${SMS_PROVIDER_URL:-}
      SMS_AUTH_TOKEN: ${SMS_AUTH_TOKEN:-}
      NOTIFICATION_DELIVERY_CRON: ${NOTIFICATION_DELIVERY_CRON:-0 0 9 * * *}
      NOTIFICATION_DELIVERY_ZONE: ${NOTIFICATION_DELIVERY_ZONE:-Asia/Kolkata}
      NOTIFICATION_DELIVERY_BATCH_SIZE: ${NOTIFICATION_DELIVERY_BATCH_SIZE:-500}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:8090}
    ports:
      - "8095:8095"
    volumes:
      - ./logs:/app/logs
    depends_on:
      - mongodb
      - kafka
      - keycloak
    networks:
      - ecom_service-net

  dispatch-service:
    build:
      context: ./dispatch-service
    container_name: dispatch-service
    restart: unless-stopped
    environment:
      <<: *otel-environment
      MONGODB_URI: mongodb://mongodb:27017/dispatch_service
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}/realms/ecomservice
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/ecomservice/protocol/openid-connect/certs
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:8090}
    ports:
      - "8093:8093"
    volumes:
      - ./logs:/app/logs
    depends_on:
      - mongodb
      - kafka
      - keycloak
    networks:
      - ecom_service-net

  cart-service:
    build:
      context: ./cart-service
    container_name: cart-service
    restart: unless-stopped
    environment:
      <<: *otel-environment
      MONGODB_URI: mongodb://mongodb:27017/cart_service
      PRODUCT_SERVICE_URL: http://product-service:8097
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}/realms/ecomservice
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/ecomservice/protocol/openid-connect/certs
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:8090}
    ports:
      - "8092:8092"
    volumes:
      - ./logs:/app/logs
    depends_on:
      - mongodb
      - product-service
      - keycloak
    networks:
      - ecom_service-net

volumes:
  mysql_data:
  mongodb_data:
  prometheus_data:
  loki_data:
  tempo_data:
  alloy_data:
  grafana_data:

networks:
  ecom_service-net:
