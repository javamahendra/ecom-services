spring.application.name=auth-service
server.port=8091
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/auth_service}
spring.datasource.username=${MYSQL_USER:auth_service}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
info.app.name=${spring.application.name}
info.app.description=Authentication and user profile service

logging.level.root=INFO
logging.level.com.app=INFO
logging.pattern.level=%5p [${spring.application.name},%X{traceId:-},%X{spanId:-},%X{requestId:-}]
logging.file.name=${LOG_FILE:logs/auth-service.log}
logging.logback.rollingpolicy.max-file-size=20MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=1GB
management.tracing.sampling.probability=${OTEL_TRACES_SAMPLER_ARG:1.0}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
management.otlp.metrics.export.enabled=false
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true

keycloak.server-url=${KEYCLOAK_SERVER_URL:http://localhost:8081}
keycloak.realm=${KEYCLOAK_REALM:ecomservice}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:auth-service}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:Io2dOy0EyMqFrS43M9DG4YHnkSlEd290}
keycloak.auth-client-id=${KEYCLOAK_AUTH_CLIENT_ID:${keycloak.client-id}}
keycloak.auth-client-secret=${KEYCLOAK_AUTH_CLIENT_SECRET:${keycloak.client-secret:}}
keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/ecomservice}
keycloak.token-uri=${KEYCLOAK_TOKEN_URI:${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/ecomservice}/protocol/openid-connect/token}
#app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8090}

app.cors.allowed-origins=*

spring.security.oauth2.resourceserver.jwt.issuer-uri=${keycloak.issuer-uri}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/ecomservice/protocol/openid-connect/certs}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
