spring.application.name=api-gateway
server.port=8090
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:false}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
springdoc.swagger-ui.url=/openapi.yaml
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.customCssUrl=/swagger-branding.css

gateway.routes.auth=${AUTH_SERVICE_URL:http://localhost:8091}
gateway.routes.cart=${CART_SERVICE_URL:http://localhost:8092}
gateway.routes.dispatch=${DISPATCH_SERVICE_URL:http://localhost:8093}
gateway.routes.inventory=${INVENTORY_SERVICE_URL:http://localhost:8094}
gateway.routes.notification=${NOTIFICATION_SERVICE_URL:http://localhost:8095}
gateway.routes.order=${ORDER_SERVICE_URL:http://localhost:8096}
gateway.routes.product=${PRODUCT_SERVICE_URL:http://localhost:8097}

gateway.routes.keycloak=${KEYCLOAK_SERVICE_URL:http://localhost:8081}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8090}

logging.level.root=INFO
logging.level.com.app=INFO
logging.pattern.level=%5p [${spring.application.name},%X{requestId:-}]
logging.file.name=${LOG_FILE:logs/api-gateway.log}
logging.logback.rollingpolicy.max-file-size=20MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=1GB
