spring.application.name=notification-service
server.port=8095
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/notification_service}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.app.event
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/ecomservice}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/ecomservice/protocol/openid-connect/certs}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8090}

logging.level.root=INFO
logging.level.com.app=INFO
logging.pattern.level=%5p [${spring.application.name},%X{traceId:-},%X{spanId:-},%X{requestId:-}]
logging.file.name=${LOG_FILE:logs/notification-service.log}
logging.logback.rollingpolicy.max-file-size=20MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=1GB
management.tracing.sampling.probability=${OTEL_TRACES_SAMPLER_ARG:1.0}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
management.otlp.metrics.export.enabled=false
management.metrics.distribution.percentiles-histogram.http.server.requests=true
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true

notification.email.from=${MAIL_FROM:no-reply@example.com}
notification.email.host=${MAIL_HOST:}
notification.email.port=${MAIL_PORT:587}
notification.email.username=${MAIL_USERNAME:}
notification.email.password=${MAIL_PASSWORD:}
notification.email.starttls=${MAIL_STARTTLS:true}
notification.sms.provider-url=${SMS_PROVIDER_URL:}
notification.sms.auth-token=${SMS_AUTH_TOKEN:}
notification.delivery.cron=${NOTIFICATION_DELIVERY_CRON:0 0 9 * * *}
notification.delivery.zone=${NOTIFICATION_DELIVERY_ZONE:Asia/Kolkata}
notification.delivery.batch-size=${NOTIFICATION_DELIVERY_BATCH_SIZE:500}
